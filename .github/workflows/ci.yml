name: Auth Service CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  actions: read
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('prod-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prod-requirements.txt

      - name: Load environment variables from .env.dev
        run: |
          export $(grep -v '^#' .env.dev | xargs) && \
          echo "DATABASE_NAME=$DATABASE_NAME" >> $GITHUB_ENV && \
          echo "DATABASE_USER=$DATABASE_USER" >> $GITHUB_ENV && \
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> $GITHUB_ENV && \
          echo "DATABASE_HOST=$DATABASE_HOST" >> $GITHUB_ENV && \
          echo "DATABASE_PORT=$DATABASE_PORT" >> $GITHUB_ENV && \
          echo "REDIS_HOST=$REDIS_HOST" >> $GITHUB_ENV && \
          echo "REDIS_PORT=$REDIS_PORT" >> $GITHUB_ENV && \
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> $GITHUB_ENV && \
          echo "REDIS_KEY_EXPIRE_SECONDS=$REDIS_KEY_EXPIRE_SECONDS" >> $GITHUB_ENV && \
          echo "TOKEN_SECRET_KEY=$TOKEN_SECRET_KEY" >> $GITHUB_ENV && \
          echo "TOKEN_ALGORITHM=$TOKEN_ALGORITHM" >> $GITHUB_ENV && \
          echo "TOKEN_EXPIRE_HOURS=$TOKEN_EXPIRE_HOURS" >> $GITHUB_ENV && \
          echo "REFRESH_TOKEN_EXPIRE_HOURS=$REFRESH_TOKEN_EXPIRE_HOURS" >> $GITHUB_ENV && \
          echo "NOTIFICATION_SERVICE_URL=$NOTIFICATION_SERVICE_URL" >> $GITHUB_ENV && \
          echo "OBJECT_STORAGE_ACCESS_KEY=$OBJECT_STORAGE_ACCESS_KEY" >> $GITHUB_ENV && \
          echo "OBJECT_STORAGE_SECRET_KEY=$OBJECT_STORAGE_SECRET_KEY" >> $GITHUB_ENV && \
          echo "OBJECT_STORAGE_ENDPOINT_URL=$OBJECT_STORAGE_ENDPOINT_URL" >> $GITHUB_ENV

      - name: Run tests
        run: |
          python -m pytest test/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: auth-service
          name: auth-service-coverage

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan (excluding tests)
        run: |
          bandit -r src -x tests,test,__tests__ -f txt -o bandit-report.txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.txt

  build-and-push:
    needs: [test, security-scan, bandit-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying auth service to staging..."
          # TODO: Add staging deployment commands here

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying auth service to production..."
          # TODO: Add production deployment commands here
