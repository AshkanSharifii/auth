# .github/workflows/ci.yml
# For postino-auth-service repository
name: Auth Service CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  actions: read
  contents: read
  security-events: write  # Required to upload SARIF to code scanning

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('prod-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prod-requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src test --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Format check with black
        run: |
          pip install black
          black --check src test

      - name: Sort imports check
        run: |
          pip install isort
          isort --check-only src test

      - name: Type checking with mypy
        run: |
          pip install mypy
          mypy src --ignore-missing-imports

      - name: Security check with bandit
        run: |
          pip install bandit
          bandit -r src -f json

      - name: Set environment variables
        run: |
          echo "DATABASE_NAME=testdb" >> $GITHUB_ENV
          echo "DATABASE_USER=testuser" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=testpass" >> $GITHUB_ENV
          echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
          echo "DATABASE_PORT=5432" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=" >> $GITHUB_ENV
          echo "REDIS_KEY_EXPIRE_SECONDS=180" >> $GITHUB_ENV
          echo "TOKEN_SECRET_KEY=test-secret-key" >> $GITHUB_ENV
          echo "TOKEN_ALGORITHM=HS256" >> $GITHUB_ENV
          echo "TOKEN_EXPIRE_HOURS=24" >> $GITHUB_ENV
          echo "REFRESH_TOKEN_EXPIRE_HOURS=168" >> $GITHUB_ENV
          echo "NOTIFICATION_SERVICE_URL=http://localhost:8001" >> $GITHUB_ENV
          echo "OBJECT_STORAGE_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "OBJECT_STORAGE_SECRET_KEY=test" >> $GITHUB_ENV
          echo "OBJECT_STORAGE_ENDPOINT_URL=http://localhost:9000" >> $GITHUB_ENV
          echo "VALID_LOGIN_RETRIES=3" >> $GITHUB_ENV
          echo "LOCK_USER_MINUTES=10" >> $GITHUB_ENV
          echo "APP_ENV=test" >> $GITHUB_ENV

      - name: Run tests
        run: |
          python -m pytest test/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: auth-service
          name: auth-service-coverage

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3  # ✅ updated version
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    needs: [test, security-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying auth service to staging..."
          # TODO: Add staging deployment commands here

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying auth service to production..."
          # TODO: Add production deployment commands here
