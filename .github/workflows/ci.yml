name: Auth Service CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Code Quality and Linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('prod-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prod-requirements.txt
          pip install flake8 black isort mypy

      - name: Run Black (code formatting check)
        run: black --check --diff src/ test/

      - name: Run isort (import sorting check)
        run: isort --check-only --diff src/ test/

      - name: Run flake8 (linting)
        run: flake8 src/ test/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run mypy (type checking)
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Bandit Security Scan for Python
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit scan (excluding tests)
        run: |
          bandit -r src -x tests,test,__tests__ -f json -o bandit-report.json || true
          bandit -r src -x tests,test,__tests__ -f txt -o bandit-report.txt || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-report.txt

  # Dependency Security Check
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: safety check --file prod-requirements.txt --json --output safety-report.json || true

      - name: Upload safety report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  # Tests (Currently Skipped)
  test:
    runs-on: ubuntu-latest
    if: false  # Skip tests for now as requested

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('prod-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prod-requirements.txt

      - name: Load environment variables from .env.dev
        run: |
          export $(grep -v '^#' .env.dev | xargs) && \
          echo "DATABASE_NAME=$DATABASE_NAME" >> $GITHUB_ENV && \
          echo "DATABASE_USER=$DATABASE_USER" >> $GITHUB_ENV && \
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> $GITHUB_ENV && \
          echo "DATABASE_HOST=$DATABASE_HOST" >> $GITHUB_ENV && \
          echo "DATABASE_PORT=$DATABASE_PORT" >> $GITHUB_ENV && \
          echo "REDIS_HOST=$REDIS_HOST" >> $GITHUB_ENV && \
          echo "REDIS_PORT=$REDIS_PORT" >> $GITHUB_ENV && \
          echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> $GITHUB_ENV && \
          echo "REDIS_KEY_EXPIRE_SECONDS=$REDIS_KEY_EXPIRE_SECONDS" >> $GITHUB_ENV && \
          echo "TOKEN_SECRET_KEY=$TOKEN_SECRET_KEY" >> $GITHUB_ENV && \
          echo "TOKEN_ALGORITHM=$TOKEN_ALGORITHM" >> $GITHUB_ENV && \
          echo "TOKEN_EXPIRE_HOURS=$TOKEN_EXPIRE_HOURS" >> $GITHUB_ENV && \
          echo "REFRESH_TOKEN_EXPIRE_HOURS=$REFRESH_TOKEN_EXPIRE_HOURS" >> $GITHUB_ENV && \
          echo "NOTIFICATION_SERVICE_URL=$NOTIFICATION_SERVICE_URL" >> $GITHUB_ENV && \
          echo "OBJECT_STORAGE_ACCESS_KEY=$OBJECT_STORAGE_ACCESS_KEY" >> $GITHUB_ENV && \
          echo "OBJECT_STORAGE_SECRET_KEY=$OBJECT_STORAGE_SECRET_KEY" >> $GITHUB_ENV && \
          echo "OBJECT_STORAGE_ENDPOINT_URL=$OBJECT_STORAGE_ENDPOINT_URL" >> $GITHUB_ENV

      - name: Run tests
        run: |
          python -m pytest test/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: auth-service
          name: auth-service-coverage

  # Docker Build Validation
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: auth-service:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'auth-service:ci-test'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'

  # Summary Job
  ci-summary:
    runs-on: ubuntu-latest
    needs: [lint, security-scan, bandit-scan, dependency-check, docker-build]
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit Scan | ${{ needs.bandit-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Check | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.lint.result }}" == "success" && 
                "${{ needs.security-scan.result }}" == "success" && 
                "${{ needs.bandit-scan.result }}" == "success" && 
                "${{ needs.dependency-check.result }}" == "success" && 
                "${{ needs.docker-build.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ Some CI checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
